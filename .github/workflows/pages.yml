name: Deploy exact Kimi site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Verify required runtime files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/index-ClUC_4GS.js
          test -f assets/index-SCz4HByz.css
          test -f hero-bg.jpg
          test -f doctor-portrait.jpg
          test -f pwa-icon.png
          test -f manifest.webmanifest
          test -f sw.js

      - name: Generate verified PWA icons from the approved logo
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the logo proportions and centre it on a square background.
          convert pwa-icon.png -auto-orient -strip -resize 180x180 -gravity center -background '#0d5f5b' -extent 180x180 apple-touch-icon-180.png
          convert pwa-icon.png -auto-orient -strip -resize 192x192 -gravity center -background '#0d5f5b' -extent 192x192 pwa-icon-192.png
          convert pwa-icon.png -auto-orient -strip -resize 512x512 -gravity center -background '#0d5f5b' -extent 512x512 pwa-icon-512.png
          convert pwa-icon.png -auto-orient -strip -resize 410x410 -gravity center -background '#0d5f5b' -extent 512x512 pwa-icon-maskable-512.png
          test "$(identify -format '%wx%h' apple-touch-icon-180.png)" = '180x180'
          test "$(identify -format '%wx%h' pwa-icon-192.png)" = '192x192'
          test "$(identify -format '%wx%h' pwa-icon-512.png)" = '512x512'
          test "$(identify -format '%wx%h' pwa-icon-maskable-512.png)" = '512x512'
          identify -format '%m %wx%h\n' apple-touch-icon-180.png pwa-icon-192.png pwa-icon-512.png pwa-icon-maskable-512.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
