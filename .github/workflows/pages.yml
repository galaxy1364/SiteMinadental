name: Deploy exact Kimi site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact site bytes
        uses: actions/checkout@v4

      - name: Verify required runtime files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/index-ClUC_4GS.js
          test -f assets/index-SCz4HByz.css
          test -f hero-bg.jpg
          test -f doctor-portrait.jpg
          test -f pwa-icon.png
          test -f manifest.webmanifest
          test -f sw.js

      - name: Generate standards-compliant PWA icons
        shell: bash
        run: |
          set -euo pipefail
          convert pwa-icon.png -resize 192x192! -strip pwa-icon-192.png
          convert pwa-icon.png -resize 512x512! -strip pwa-icon-512.png
          convert pwa-icon.png -resize 410x410! -gravity center -background '#0d5f5b' -extent 512x512 -strip pwa-icon-maskable-512.png
          test "$(identify -format '%wx%h' pwa-icon-192.png)" = '192x192'
          test "$(identify -format '%wx%h' pwa-icon-512.png)" = '512x512'
          test "$(identify -format '%wx%h' pwa-icon-maskable-512.png)" = '512x512'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload exact static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
