name: Build requested PWA icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pwa-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode requested icon
        shell: bash
        run: |
          cat > pwa-icon.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < pwa-icon.b64 | base64 -d > pwa-icon.png
          file pwa-icon.png
      - name: Commit icon
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pwa-icon.png
          git commit -m 'Add requested tooth logo as PWA icon' || exit 0
          git push
