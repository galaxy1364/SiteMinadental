name: Enterprise Security & Clean-Source Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - '**/*.xml'
      - '**/*.txt'
      - '_headers'
      - '_redirects'
      - '.well-known/security.txt'
      - '.github/workflows/enterprise-security-ci.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: enterprise-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-source-integrity:
    name: Clean-source public release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in config.js assets/js/site.js sw.js _worker.js status-runtime.js; do test -f "$file"; node --check "$file"; done
      - name: JSON and XML integrity
        shell: python
        run: |
          import json, xml.etree.ElementTree as ET
          for f in ('manifest.webmanifest','version.json','search-index.json'): json.load(open(f, encoding='utf-8'))
          for f in ('sitemap.xml','feed.xml','opensearch.xml'): ET.parse(f)
          print('JSON/XML PASS')
      - name: Clean-source truth and security contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"channel": "clean-source-rc1"' version.json
          grep -q '"productionReady": false' version.json
          grep -q 'bookingConnected: false' config.js
          grep -q 'patientPortalConnected: false' config.js
          grep -q 'aiConciergeConnected: false' config.js
          grep -q "style-src 'self'" _headers
          grep -q "script-src 'self'" _headers
          if grep -q "unsafe-inline\|unsafe-eval" _headers; then echo 'Unsafe CSP directive detected' >&2; exit 1; fi
          if grep -q 'assets/index-ClUC_4GS.js\|site-hardening.js\|path-fix.js\|pwa-runtime.js' index.html; then echo 'Root still depends on legacy containment runtime' >&2; exit 1; fi
          active=(index.html services guides experience booking tools ai-info safety dentist-tehran-22 contact about links install.html portal)
          if grep -R -E -n '09105306142|989105306142|galaxy\.mehdi\.m@gmail\.com|35\.7219|51\.3347|35\.748836|51\.247835|خیابان امیرکبیر.*یاس|Dr\.mina\.mazandarani|dr_mina_mazandarani' "${active[@]}" config.js manifest.webmanifest; then echo 'Unverified owner/provider data escaped into active clean source' >&2; exit 1; fi
          test -f .v9latest/V9_RUNTIME_SHA256SUMS.txt
          echo 'Truth/security PASS'
      - name: HTML structure accessibility and local-link audit
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import posixpath, sys
          pages=['index.html','services/index.html','services/implant/index.html','services/laminate-composite/index.html','services/root-canal/index.html','services/oral-surgery/index.html','services/pediatric/index.html','services/bleaching/index.html','services/prosthodontics/index.html','services/radiography/index.html','guides/index.html','guides/dental-pain-red-flags/index.html','guides/dental-implant-consultation/index.html','guides/child-first-dental-visit/index.html','guides/oral-hygiene-basics/index.html','guides/root-canal-explained/index.html','guides/teeth-whitening-safety/index.html','experience/index.html','booking/index.html','tools/treatment-comparison/index.html','ai-info/index.html','safety/dental-emergency/index.html','dentist-tehran-22/index.html','contact/index.html','about/index.html','links/index.html','install.html','portal/index.html','privacy.html','accessibility.html','status.html','ai-transparency.html','editorial-governance.html','offline.html','404.html']
          failures=[]; existing={p.as_posix() for p in Path('.').rglob('*') if p.is_file()}
          class Audit(HTMLParser):
              def __init__(self,page): super().__init__(convert_charrefs=True); self.page=page; self.html={}; self.main=0; self.h1=0; self.ids=set(); self.dups=set(); self.links=[]; self.images=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='html': self.html=a
                  if tag=='main': self.main+=1
                  if tag=='h1': self.h1+=1
                  if 'id' in a:
                      if a['id'] in self.ids: self.dups.add(a['id'])
                      self.ids.add(a['id'])
                  if tag=='a' and a.get('href') is not None: self.links.append((a.get('href',''),a))
                  if tag=='img': self.images.append(a)
          def resolve(page,href):
              if not href or href.startswith(('#','mailto:','tel:','sms:','javascript:','data:')): return None
              u=urlsplit(href)
              if u.scheme or u.netloc: return None
              target=href.split('#',1)[0].split('?',1)[0]
              if not target: return None
              rel=target.lstrip('/') if target.startswith('/') else posixpath.normpath(posixpath.join(posixpath.dirname(page),target))
              if rel in ('','.'): rel='index.html'
              elif rel.endswith('/'): rel+='index.html'
              elif '.' not in posixpath.basename(rel): rel+='/index.html'
              return posixpath.normpath(rel)
          for p in pages:
              path=Path(p)
              if not path.is_file(): failures.append(f'{p}: missing'); continue
              raw=path.read_text('utf-8'); a=Audit(p); a.feed(raw)
              if a.html.get('lang')!='fa' or a.html.get('dir')!='rtl': failures.append(f'{p}: lang/dir')
              if a.main!=1: failures.append(f'{p}: main count {a.main}')
              if a.h1!=1: failures.append(f'{p}: h1 count {a.h1}')
              if a.dups: failures.append(f'{p}: duplicate ids {sorted(a.dups)}')
              if '<style' in raw or ' style=' in raw: failures.append(f'{p}: inline style')
              for img in a.images:
                  if 'alt' not in img: failures.append(f'{p}: img without alt')
              for href,attrs in a.links:
                  if href=='#': failures.append(f'{p}: empty hash href')
                  if attrs.get('target')=='_blank' and not {'noopener','noreferrer'} <= set((attrs.get('rel') or '').split()): failures.append(f'{p}: target blank without noopener noreferrer')
                  dest=resolve(p,href)
                  if dest and dest not in existing: failures.append(f'{p}: broken local link {href} -> {dest}')
          if failures: print('\n'.join(failures)); sys.exit(1)
          print(f'HTML/link audit PASS: {len(pages)} pages')
      - name: Sitemap and privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SiteMinadental/services/implant/' sitemap.xml
          grep -q 'SiteMinadental/guides/child-first-dental-visit/' sitemap.xml
          grep -q 'SiteMinadental/dentist-tehran-22/' sitemap.xml
          if grep -q 'SiteMinadental/portal/' sitemap.xml; then echo 'Private portal must not be in sitemap' >&2; exit 1; fi
          grep -q 'Disallow: /portal/' robots.txt
          grep -q 'noindex,nofollow' portal/index.html
          echo 'Sitemap/privacy PASS'
  production-external-readiness:
    name: External production readiness (truth report)
    runs-on: ubuntu-latest
    needs: clean-source-integrity
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Report external blockers without fake failure
        shell: bash
        run: |
          { echo '## Production external readiness'; echo '- Clean-source code gate: PASS'; echo '- Custom production domain: BLOCKED_EXTERNAL until direct domain/Cloudflare evidence'; echo '- Booking/OTP/Portal/Payments/AI providers: BLOCKED_EXTERNAL while config runtime flags are false'; echo '- Field CWV/manual accessibility/pentest: NOT_MEASURED_YET'; echo '- Historical V9 manifest retained for forensic evidence; no longer the live source contract'; } >> "$GITHUB_STEP_SUMMARY"
  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:javascript-typescript'
