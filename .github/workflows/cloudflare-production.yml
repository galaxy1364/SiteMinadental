name: Cloudflare Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minadentalclinic-cloudflare-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v6

      - name: Refuse non-V9 or unconfigured deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_PAGES_PROJECT:-}"
          grep -q '2026.08.30.9' version.json
          grep -q 'enterprise-v9' version.json
          grep -q 'https://minadentalclinic.ir/' index.html
          test -f _worker.js
          test -f .v9latest/V9_RUNTIME_SHA256SUMS.txt || {
            echo 'Exact runtime manifest is required before deployment.' >&2
            exit 1
          }

      - name: Rebuild exact 69-file deployment directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/minadentalclinic-production
          mkdir -p /tmp/minadentalclinic-production
          while read -r hash path; do
            test -n "$hash" && test -n "$path"
            test -f "$path"
            mkdir -p "/tmp/minadentalclinic-production/$(dirname "$path")"
            cp -p "$path" "/tmp/minadentalclinic-production/$path"
          done < .v9latest/V9_RUNTIME_SHA256SUMS.txt
          cd /tmp/minadentalclinic-production
          sha256sum -c "$GITHUB_WORKSPACE/.v9latest/V9_RUNTIME_SHA256SUMS.txt"
          test "$(find . -type f | wc -l)" -eq 69
          node --check _worker.js
          node --check sw.js
          node --check assets/js/site.js
          node --check assets/js/admin.js
          node --check assets/js/portal.js
          node --check assets/js/status.js

      - name: Deploy exact runtime to existing Cloudflare Pages project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy /tmp/minadentalclinic-production \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true

      - name: Production smoke verification
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            body="$(curl --fail --silent --show-error --max-time 20 https://minadentalclinic.ir/version.json || true)"
            if printf '%s' "$body" | grep -q '2026.08.30.9'; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 10
          done
          echo 'Production domain did not expose V9 after deploy.' >&2
          exit 1
