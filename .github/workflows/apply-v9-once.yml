name: Apply verified MinaDentalClinic Enterprise V9

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minadentalclinic-v9-apply
  cancel-in-progress: false

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assemble exact verified runtime
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .v9verified -maxdepth 1 -type f -name 'part-*.txt' | sort)
          test "${#parts[@]}" -gt 0
          : > /tmp/v9-runtime.b64
          for part in "${parts[@]}"; do
            test "$(tail -c 1 "$part")" = 'X'
            head -c -1 "$part" >> /tmp/v9-runtime.b64
          done
          base64 --decode /tmp/v9-runtime.b64 > /tmp/v9-runtime.tar.xz
          xz -t /tmp/v9-runtime.tar.xz

      - name: Verify exact V9 runtime content
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v9-site
          mkdir -p /tmp/v9-site
          tar -xJf /tmp/v9-runtime.tar.xz -C /tmp/v9-site
          test "$(find /tmp/v9-site -type f | wc -l)" -eq 69
          cd /tmp/v9-site
          sha256sum -c "$GITHUB_WORKSPACE/.v9latest/V9_RUNTIME_SHA256SUMS.txt"
          for file in index.html _worker.js sw.js version.json admin.html portal/index.html assets/css/site.css assets/js/site.js assets/js/admin.js assets/js/portal.js assets/js/status.js status/index.html safety/dental-emergency/index.html tools/treatment-comparison/index.html; do
            test -f "$file"
          done
          grep -q '2026.08.30.9' version.json
          grep -q 'enterprise-v9' version.json
          grep -q 'https://minadentalclinic.ir/' index.html
          if grep -R -n -F '2026.08.05.1' .; then exit 1; fi
          if grep -R -n -F 'galaxy1364.github.io/SiteMinadental' .; then exit 1; fi
          node --check _worker.js
          node --check sw.js
          node --check assets/js/site.js
          node --check assets/js/admin.js
          node --check assets/js/portal.js
          node --check assets/js/status.js

      - name: Replace runtime atomically and preserve DevSecOps controls
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/v9-site/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No production changes.'; exit 0; }
          git commit -m 'Deploy MinaDentalClinic Enterprise V9 code-hardened'
          git push origin HEAD:main
