name: Forensic V9 Recovery Verification — Non-Deploying

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.v9latest/**'
      - '.github/workflows/apply-v9-once.yml'

permissions:
  contents: read

concurrency:
  group: minadentalclinic-v9-forensic
  cancel-in-progress: true

jobs:
  verify-payload:
    name: Recover and verify historical V9 payload without deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Attempt exact content recovery
        shell: bash
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/.v9latest/V9_RUNTIME_SHA256SUMS.txt"
          test -f "$manifest"
          test "$(wc -l < "$manifest")" -eq 69

          verify_root() {
            local root="$1"
            test -f "$root/version.json" || return 1
            test "$(find "$root" -type f | wc -l)" -eq 69 || return 1
            (cd "$root" && sha256sum -c "$manifest" >/tmp/manifest-check.log 2>&1) || return 1
          }

          normalize_root() {
            local extracted="$1"
            if verify_root "$extracted"; then
              rm -rf /tmp/v9-site; cp -a "$extracted" /tmp/v9-site; return 0
            fi
            while IFS= read -r version; do
              local root
              root="$(dirname "$version")"
              if verify_root "$root"; then
                rm -rf /tmp/v9-site; cp -a "$root" /tmp/v9-site; return 0
              fi
            done < <(find "$extracted" -type f -name version.json -print)
            return 1
          }

          try_payload() {
            local payload="$1"
            for mode in raw base64; do
              rm -rf /tmp/extracted; mkdir -p /tmp/extracted
              if [ "$mode" = raw ]; then
                cp "$payload" /tmp/candidate.bin
              else
                tr -d '\r\n\t ' < "$payload" > /tmp/candidate.b64
                base64 --decode /tmp/candidate.b64 > /tmp/candidate.bin 2>/dev/null || continue
              fi
              if xz -t /tmp/candidate.bin 2>/dev/null; then
                tar -xJf /tmp/candidate.bin -C /tmp/extracted 2>/dev/null || continue
                normalize_root /tmp/extracted && return 0
              fi
              rm -rf /tmp/extracted; mkdir -p /tmp/extracted
              if unzip -tqq /tmp/candidate.bin >/dev/null 2>&1; then
                unzip -qq /tmp/candidate.bin -d /tmp/extracted || continue
                normalize_root /tmp/extracted && return 0
              fi
            done
            return 1
          }

          selected=''
          source_mode=''
          selected_dir=''

          echo '=== Phase 1: direct historical V9 root trees ==='
          while read -r ref; do
            [ -n "$ref" ] || continue
            git cat-file -e "$ref:version.json" 2>/dev/null || continue
            version_text="$(git show "$ref:version.json" 2>/dev/null || true)"
            [[ "$version_text" == *'2026.08.30.9'* && "$version_text" == *'enterprise-v9'* ]] || continue
            rm -rf /tmp/direct-site; mkdir -p /tmp/direct-site
            complete=1
            while read -r hash path; do
              git cat-file -e "$ref:$path" 2>/dev/null || { complete=0; break; }
              mkdir -p "/tmp/direct-site/$(dirname "$path")"
              git show "$ref:$path" > "/tmp/direct-site/$path"
            done < "$manifest"
            if [ "$complete" -eq 1 ] && verify_root /tmp/direct-site; then
              rm -rf /tmp/v9-site; mv /tmp/direct-site /tmp/v9-site
              selected="$ref"; source_mode='tree'; break
            fi
          done < <(git log --all --format='%H' -- version.json | awk '!seen[$0]++')

          if [ -z "$selected" ]; then
            echo '=== Phase 2: historical direct archives ==='
            while read -r ref; do
              [ -n "$ref" ] || continue
              git cat-file -e "$ref:.v9stage/runtime.tar.xz" 2>/dev/null || continue
              git show "$ref:.v9stage/runtime.tar.xz" > /tmp/source.raw
              if try_payload /tmp/source.raw; then
                selected="$ref"; source_mode='archive'; selected_dir='.v9stage/runtime.tar.xz'; break
              fi
            done < <(git log --all --format='%H' -- .v9stage/runtime.tar.xz | awk '!seen[$0]++')
          fi

          if [ -z "$selected" ]; then
            echo '=== Phase 3: coherent historical chunk snapshots ==='
            dirs=(.v9verified .v9latest .v9xz .v9b64 .v9payload exact-payload .payload)
            for dir in "${dirs[@]}"; do
              while read -r ref; do
                [ -n "$ref" ] || continue
                mapfile -t parts < <(git ls-tree -r --name-only "$ref" -- "$dir" | grep -E '(^|/)part-[0-9]+' | sort -V || true)
                [ "${#parts[@]}" -gt 0 ] || continue
                : > /tmp/source.raw
                for part in "${parts[@]}"; do git show "$ref:$part" >> /tmp/source.raw; done
                if try_payload /tmp/source.raw; then
                  selected="$ref"; source_mode='chunks'; selected_dir="$dir"; break 2
                fi
              done < <(git log --all --format='%H' -- "$dir" | awk '!seen[$0]++')
            done
          fi

          if [ -z "$selected" ]; then
            echo 'FORENSIC_RESULT=NO_EXACT_69_FILE_RUNTIME_RECOVERED'
            echo 'Deployment is intentionally unavailable in this workflow.'
            exit 1
          fi

          cd /tmp/v9-site
          grep -q '2026.08.30.9' version.json
          grep -q 'enterprise-v9' version.json
          ! grep -R -n -E '09105306142|989105306142|galaxy\.mehdi\.m@gmail\.com|خیابان امیرکبیر|Dr\.mina\.mazandarani|dr_mina_mazandarani' --include='*.html' --include='*.js' --include='*.json' --include='*.xml' --include='*.txt' .
          ! grep -R -n -E "SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*['\"][^'\"]+|sk_live_[A-Za-z0-9]+" --include='*.html' --include='*.js' --include='*.json' .
          printf 'source_mode=%s\nselected_ref=%s\nselected_dir=%s\nruntime_files=69\nmanifest=PASS\n' "$source_mode" "$selected" "$selected_dir" > /tmp/V9_RECOVERY_EVIDENCE.txt
          cat version.json >> /tmp/V9_RECOVERY_EVIDENCE.txt

      - name: Upload forensic evidence only
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: v9-forensic-recovery-evidence
          path: |
            /tmp/V9_RECOVERY_EVIDENCE.txt
            .v9latest/V9_RUNTIME_SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

      - name: Deployment safety assertion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'NON_DEPLOYING_WORKFLOW=PASS'
          echo 'This workflow has contents:read only and contains no git push or runtime replacement step.'
