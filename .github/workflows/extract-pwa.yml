name: Extract verified Kimi PWA release

on:
  push:
    branches:
      - kimi-pwa-autoupdate-v1
    paths:
      - _release/READY

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: kimi-pwa-autoupdate-v1
          fetch-depth: 0

      - name: Rebuild and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          cat _release/chunk-* > /tmp/kimi-pwa.b64
          base64 --decode /tmp/kimi-pwa.b64 > /tmp/kimi-pwa.zip
          echo "114838c28e5e41266835c0654fd727e1804bdd7bdc82149fb03a8d2b981abc77  /tmp/kimi-pwa.zip" | sha256sum --check --strict
          rm -rf /tmp/kimi-pwa
          mkdir -p /tmp/kimi-pwa
          unzip -q /tmp/kimi-pwa.zip -d /tmp/kimi-pwa
          test -f /tmp/kimi-pwa/site/index.html
          test -f /tmp/kimi-pwa/site/manifest.webmanifest
          test -f /tmp/kimi-pwa/site/sw.js
          test -f /tmp/kimi-pwa/site/version.json

      - name: Publish exact PWA files to branch root
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name _release -exec rm -rf {} +
          cp -a /tmp/kimi-pwa/site/. ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Kimi PWA v2026.08.02.1 [skip extract]"
          git push origin HEAD:kimi-pwa-autoupdate-v1
