# audit-schema: 1.5
name: Global Enterprise Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preview-r2/**'
      - 'index.html'
      - 'privacy.html'
      - 'accessibility.html'
      - 'status.html'
      - 'ai-transparency.html'
      - 'editorial-governance.html'
      - 'governance.css'
      - 'governance-nav.css'
      - 'governance-links.js'
      - 'status-runtime.js'
      - 'config.js'
      - '.github/scripts/lighthouse-median.cjs'
      - '.github/workflows/global-enterprise-audit.yml'
  schedule:
    - cron: '41 2 * * 3'

permissions:
  contents: read

concurrency:
  group: global-enterprise-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOT_URL: https://galaxy1364.github.io/SiteMinadental/
  PREVIEW_URL: https://galaxy1364.github.io/SiteMinadental/preview-r2/

jobs:
  static-integrity:
    name: Static integrity and truth contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check preview-r2/preview-a.js
          node --check preview-r2/preview-b.js
          node --check preview-r2/preview-c.js
          node --check preview-r2/preview-d.js
          node --check governance-links.js
          node --check status-runtime.js
          node --check config.js
          node --check .github/scripts/lighthouse-median.cjs

      - name: HTML validation
        run: |
          set -euo pipefail
          npx --yes html-validate@latest preview-r2/index.html
          npx --yes html-validate@latest privacy.html accessibility.html status.html ai-transparency.html editorial-governance.html

      - name: Asset and truth contract
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          root=Path('preview-r2')
          html=(root/'index.html').read_text('utf-8')
          failures=[]
          for ref in re.findall(r'(?:src|href)=["\']\.\/([^"\'#?]+)', html):
              if not (root/ref).exists(): failures.append(f'missing preview asset: {ref}')
          required=['preview-a.js','preview-b.js','preview-c.js','preview-d.js','preview.css','preview-r3.css']
          for f in required:
              if not (root/f).exists(): failures.append(f'missing required runtime: {f}')
          if 'noindex,nofollow' not in html: failures.append('preview must stay noindex,nofollow')
          alljs='\n'.join((root/f).read_text('utf-8') for f in ['preview-a.js','preview-b.js','preview-c.js','preview-d.js'])
          for forbidden in ['sk_live_','SUPABASE_SERVICE_ROLE_KEY']:
              if forbidden in alljs: failures.append(f'forbidden public secret marker: {forbidden}')
          required_routes=['/','/services','/services/implant','/services/laminate-composite','/services/root-canal','/services/oral-surgery','/services/pediatric','/services/bleaching','/services/prosthodontics','/experience','/experience/online-consultation','/experience/cost-estimate','/experience/patient-journey','/portal','/tools/treatment-comparison','/safety/dental-emergency','/ai-info','/status','/privacy','/accessibility','/guides','/qa','/audit']
          for route in required_routes:
              if route not in alljs: failures.append(f'missing route contract: {route}')

          governance=['privacy.html','accessibility.html','status.html','ai-transparency.html','editorial-governance.html']
          for name in governance:
              text=Path(name).read_text('utf-8')
              if 'Content-Security-Policy' not in text: failures.append(f'{name}: missing strict meta CSP')
              if '<style' in text or ' style=' in text: failures.append(f'{name}: inline style regression')
              if 'href="./governance.css"' not in text: failures.append(f'{name}: missing shared governance stylesheet')

          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('Static audit PASS')

  browser-audit:
    name: Real browser UX, accessibility and Lighthouse
    runs-on: ubuntu-latest
    needs: static-integrity
    steps:
      - uses: actions/checkout@v6

      - name: Wait for GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..24}; do
            root_ok=0; preview_ok=0
            curl -fsSL "$ROOT_URL/status.html" | grep -q 'status-runtime.js' && root_ok=1 || true
            curl -fsSL "$PREVIEW_URL" | grep -q 'preview-d.js' && preview_ok=1 || true
            if [ "$root_ok" -eq 1 ] && [ "$preview_ok" -eq 1 ]; then exit 0; fi
            sleep 10
          done
          echo 'GitHub Pages did not become current in time.' >&2
          exit 1

      - name: Install browser audit tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest lighthouse@latest pa11y@latest
          npx playwright install chromium --with-deps

      - name: Route smoke test in real Chromium
        shell: bash
        run: |
          cat > route-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const previewRoutes=['/','/services','/services/implant','/services/laminate-composite','/services/root-canal','/services/oral-surgery','/services/pediatric','/services/bleaching','/services/prosthodontics','/experience','/experience/online-consultation','/experience/cost-estimate','/experience/patient-journey','/portal','/tools/treatment-comparison','/safety/dental-emergency','/ai-info','/status','/privacy','/accessibility','/guides','/qa','/audit'];
          const rootPages=['','privacy.html','accessibility.html','status.html','ai-transparency.html','editorial-governance.html'];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const failures=[];
            page.on('pageerror',e=>failures.push('pageerror: '+e.message));
            for(const route of previewRoutes){
              await page.goto(process.env.PREVIEW_URL+'#'+route,{waitUntil:'networkidle'});
              await page.waitForTimeout(100);
              const main=page.locator('main');
              if(await main.count()===0){failures.push('preview '+route+': no main');continue;}
              const text=(await main.innerText()).trim();
              if(!text || text.includes('صفحه پیدا نشد')) failures.push('preview '+route+': empty/404 render');
            }
            for(const route of rootPages){
              await page.goto(process.env.ROOT_URL+route,{waitUntil:'networkidle'});
              await page.waitForTimeout(150);
              const body=(await page.locator('body').innerText()).trim();
              if(!body) failures.push('root '+route+': empty render');
              if(route){
                const main=page.locator('main');
                if(await main.count()!==1) failures.push('root '+route+': expected one main');
              }
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
              if(overflow) failures.push('root '+route+': mobile horizontal overflow');
            }
            await browser.close();
            if(failures.length){console.error(failures.join('\n'));process.exit(1)}
            console.log('Browser route audit PASS');
          })();
          NODE
          node route-audit.cjs

      - name: Lighthouse multi-run median evidence - preview
        run: node .github/scripts/lighthouse-median.cjs preview "$PREVIEW_URL"

      - name: Lighthouse multi-run median evidence - root
        run: node .github/scripts/lighthouse-median.cjs root "$ROOT_URL"

      - name: WCAG automated evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > pa11y-audit.cjs <<'NODE'
          const fs = require('fs');
          const pa11y = require('pa11y');
          const options = {
            standard: 'WCAG2AA',
            runners: ['htmlcs', 'axe'],
            includeWarnings: false,
            includeNotices: false,
            chromeLaunchConfig: {
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            }
          };
          const targets = [
            ['preview', process.env.PREVIEW_URL],
            ['privacy', process.env.ROOT_URL+'privacy.html'],
            ['accessibility', process.env.ROOT_URL+'accessibility.html'],
            ['status', process.env.ROOT_URL+'status.html'],
            ['ai-transparency', process.env.ROOT_URL+'ai-transparency.html'],
            ['editorial-governance', process.env.ROOT_URL+'editorial-governance.html']
          ];
          (async()=>{
            const report={generatedAt:new Date().toISOString(), standard:'WCAG2AA', targets:{}};
            let failures=0;
            for(const [name,url] of targets){
              const result=await pa11y(url,options);
              report.targets[name]=result;
              console.log(`${name}: ${result.issues.length} WCAG error(s)`);
              if(result.issues.length){
                failures+=result.issues.length;
                for(const issue of result.issues){
                  console.error(`${name}: ${issue.code} :: ${issue.message} :: ${issue.selector}`);
                }
              }
            }
            fs.writeFileSync('pa11y-wcag2aa.json',JSON.stringify(report,null,2));
            if(failures) process.exit(1);
          })().catch(err=>{console.error(err);process.exit(2)});
          NODE
          node pa11y-audit.cjs

      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-browser-audit-evidence
          path: |
            lighthouse-preview-*.json
            lighthouse-root-*.json
            pa11y-wcag2aa.json
          if-no-files-found: warn

  dast-baseline:
    name: OWASP ZAP DAST baseline evidence
    runs-on: ubuntu-latest
    needs: static-integrity
    continue-on-error: true
    steps:
      - name: Wait for public root
        run: |
          for i in {1..24}; do curl -fsS "$ROOT_URL" >/dev/null && exit 0; sleep 10; done; exit 1
      - name: ZAP baseline scan
        run: |
          mkdir -p zap-out
          chmod 777 zap-out
          docker run --rm -v "$PWD/zap-out:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$ROOT_URL" -I -J zap.json -r zap.html
      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-zap-evidence
          path: zap-out/
          if-no-files-found: warn
