# audit-schema: 1.2
name: Global Enterprise Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preview-r2/**'
      - '.github/workflows/global-enterprise-audit.yml'
  schedule:
    - cron: '41 2 * * 3'

permissions:
  contents: read

concurrency:
  group: global-enterprise-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_URL: https://galaxy1364.github.io/SiteMinadental/preview-r2/

jobs:
  static-integrity:
    name: Static integrity and route contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check preview-r2/preview-a.js
          node --check preview-r2/preview-b.js
          node --check preview-r2/preview-c.js
          node --check preview-r2/preview-d.js

      - name: HTML validation
        run: npx --yes html-validate@latest preview-r2/index.html

      - name: Asset and truth contract
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          root=Path('preview-r2')
          html=(root/'index.html').read_text('utf-8')
          failures=[]
          for ref in re.findall(r'(?:src|href)=["\']\.\/([^"\'#?]+)', html):
              if not (root/ref).exists(): failures.append(f'missing preview asset: {ref}')
          required=['preview-a.js','preview-b.js','preview-c.js','preview-d.js','preview.css','preview-r3.css']
          for f in required:
              if not (root/f).exists(): failures.append(f'missing required runtime: {f}')
          if 'noindex,nofollow' not in html: failures.append('preview must stay noindex,nofollow')
          alljs='\n'.join((root/f).read_text('utf-8') for f in ['preview-a.js','preview-b.js','preview-c.js','preview-d.js'])
          for forbidden in ['sk_live_','SUPABASE_SERVICE_ROLE_KEY']:
              if forbidden in alljs: failures.append(f'forbidden public secret marker: {forbidden}')
          required_routes=['/','/services','/services/implant','/services/laminate-composite','/services/root-canal','/services/oral-surgery','/services/pediatric','/services/bleaching','/services/prosthodontics','/experience','/experience/online-consultation','/experience/cost-estimate','/experience/patient-journey','/portal','/tools/treatment-comparison','/safety/dental-emergency','/ai-info','/status','/privacy','/accessibility','/guides','/qa','/audit']
          for route in required_routes:
              if route not in alljs: failures.append(f'missing route contract: {route}')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('Static audit PASS')

  browser-audit:
    name: Real browser UX, accessibility and Lighthouse
    runs-on: ubuntu-latest
    needs: static-integrity
    steps:
      - uses: actions/checkout@v7

      - name: Wait for GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if curl -fsSL "$PREVIEW_URL" | grep -q 'preview-d.js'; then exit 0; fi
            sleep 10
          done
          echo 'Preview deployment did not become current in time.' >&2
          exit 1

      - name: Install browser audit tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest lighthouse@latest pa11y@latest
          npx playwright install chromium --with-deps

      - name: Route smoke test in real Chromium
        shell: bash
        run: |
          cat > /tmp/route-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const routes=['/','/services','/services/implant','/services/laminate-composite','/services/root-canal','/services/oral-surgery','/services/pediatric','/services/bleaching','/services/prosthodontics','/experience','/experience/online-consultation','/experience/cost-estimate','/experience/patient-journey','/portal','/tools/treatment-comparison','/safety/dental-emergency','/ai-info','/status','/privacy','/accessibility','/guides','/qa','/audit'];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const base=process.env.PREVIEW_URL;
            const failures=[];
            page.on('pageerror',e=>failures.push('pageerror: '+e.message));
            for(const route of routes){
              await page.goto(base+'#'+route,{waitUntil:'networkidle'});
              await page.waitForTimeout(120);
              const text=(await page.locator('main').innerText()).trim();
              if(!text || text.includes('صفحه پیدا نشد')) failures.push(route+': empty/404 render');
            }
            await page.goto(base+'#/');
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            if(overflow) failures.push('mobile horizontal overflow detected');
            await browser.close();
            if(failures.length){console.error(failures.join('\n'));process.exit(1)}
            console.log('Browser route audit PASS: '+routes.length+' routes');
          })();
          NODE
          node /tmp/route-audit.cjs

      - name: Lighthouse evidence
        run: |
          npx lighthouse "$PREVIEW_URL" --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path=lighthouse.json
          node - <<'NODE'
          const r=require('./lighthouse.json');
          const s=r.categories;
          const scores={performance:s.performance.score,accessibility:s.accessibility.score,bestPractices:s['best-practices'].score,seo:s.seo.score};
          console.log(scores);
          // SEO is intentionally not gated because the acceptance preview is noindex.
          if(scores.performance < .80) throw new Error('Performance lab score < 0.80');
          if(scores.accessibility < .90) throw new Error('Accessibility lab score < 0.90');
          if(scores.bestPractices < .90) throw new Error('Best Practices score < 0.90');
          NODE

      - name: WCAG automated evidence
        run: |
          npx pa11y "$PREVIEW_URL" --standard WCAG2AA --reporter json > pa11y.json

      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-browser-audit-evidence
          path: |
            lighthouse.json
            pa11y.json
          if-no-files-found: warn

  dast-baseline:
    name: OWASP ZAP DAST baseline
    runs-on: ubuntu-latest
    needs: static-integrity
    continue-on-error: true
    steps:
      - name: Wait for public preview
        run: |
          for i in {1..18}; do curl -fsS "$PREVIEW_URL" >/dev/null && exit 0; sleep 10; done; exit 1
      - name: ZAP baseline scan
        run: |
          mkdir -p zap-out
          chmod 777 zap-out
          docker run --rm -v "$PWD/zap-out:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$PREVIEW_URL" -I -J zap.json -r zap.html
      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-zap-evidence
          path: zap-out/
          if-no-files-found: warn
