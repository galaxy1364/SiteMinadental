name: Global Enterprise Browser Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'services/**'
      - 'guides/**'
      - 'experience/**'
      - 'booking/**'
      - 'tools/**'
      - 'ai-info/**'
      - 'safety/**'
      - 'dentist-tehran-22/**'
      - 'contact/**'
      - 'about/**'
      - 'links/**'
      - 'portal/**'
      - 'assets/css/site.css'
      - 'assets/js/site.js'
      - 'sw.js'
      - 'version.json'
      - 'manifest.webmanifest'
      - 'sitemap.xml'
      - '.github/scripts/lighthouse-median.cjs'
      - '.github/workflows/global-enterprise-audit.yml'
  schedule:
    - cron: '41 2 * * 3'

permissions:
  contents: read

concurrency:
  group: global-enterprise-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOT_URL: https://galaxy1364.github.io/SiteMinadental/

jobs:
  browser-audit:
    name: Real Chromium, Lighthouse and WCAG evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Wait for exact GitHub Pages snapshot
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..48}; do
            ok=1
            curl -fsSL -H 'Cache-Control: no-cache' -o /tmp/root.html "${ROOT_URL}?audit=${GITHUB_SHA}" || ok=0
            curl -fsSL -H 'Cache-Control: no-cache' -o /tmp/services.html "${ROOT_URL}services/?audit=${GITHUB_SHA}" || ok=0
            curl -fsSL -H 'Cache-Control: no-cache' -o /tmp/site.js "${ROOT_URL}assets/js/site.js?audit=${GITHUB_SHA}" || ok=0
            curl -fsSL -H 'Cache-Control: no-cache' -o /tmp/site.css "${ROOT_URL}assets/css/site.css?audit=${GITHUB_SHA}" || ok=0
            curl -fsSL -H 'Cache-Control: no-cache' -o /tmp/sw.js "${ROOT_URL}sw.js?audit=${GITHUB_SHA}" || ok=0
            curl -fsSL -H 'Cache-Control: no-cache' -o /tmp/version.json "${ROOT_URL}version.json?audit=${GITHUB_SHA}" || ok=0
            if [ "$ok" -eq 1 ] \
              && cmp -s index.html /tmp/root.html \
              && cmp -s services/index.html /tmp/services.html \
              && cmp -s assets/js/site.js /tmp/site.js \
              && cmp -s assets/css/site.css /tmp/site.css \
              && cmp -s sw.js /tmp/sw.js \
              && cmp -s version.json /tmp/version.json; then
              echo "Exact Pages HTML/JS/CSS/SW/version snapshot verified for ${GITHUB_SHA}"
              exit 0
            fi
            sleep 10
          done
          echo 'Exact GitHub Pages runtime snapshot was not published in audit window' >&2
          exit 1
      - name: Install browser audit tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest lighthouse@latest pa11y@latest axe-core@latest
          npx playwright install chromium --with-deps
      - name: Multi-route real Chromium audit
        shell: bash
        run: |
          cat > route-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const routes=['','services/','services/implant/','services/oral-surgery/','services/root-canal/','services/laminate-composite/','services/pediatric/','guides/','guides/dental-pain-red-flags/','guides/child-first-dental-visit/','experience/','booking/','tools/treatment-comparison/','ai-info/','safety/dental-emergency/','dentist-tehran-22/','contact/','about/','links/','install.html','privacy.html','accessibility.html','status.html','ai-transparency.html','editorial-governance.html','portal/'];
          (async()=>{const browser=await chromium.launch({headless:true});const failures=[];for(const viewport of [{width:390,height:844},{width:1440,height:1000}]){const page=await browser.newPage({viewport});page.on('pageerror',e=>failures.push(`pageerror ${e.message}`));page.on('console',m=>{if(m.type()==='error')failures.push(`console ${m.text()}`)});for(const route of routes){const join=route.includes('?')?'&':'?';const response=await page.goto(process.env.ROOT_URL+route+join+'audit='+process.env.GITHUB_SHA,{waitUntil:'networkidle'});if(!response||response.status()>=400)failures.push(`${route}: HTTP ${response?.status()}`);const main=page.locator('main'),h1=page.locator('h1');if(await main.count()!==1)failures.push(`${route}: main count`);if(await h1.count()!==1)failures.push(`${route}: h1 count`);const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);if(overflow)failures.push(`${route}: horizontal overflow ${viewport.width}`)}await page.close()}await browser.close();if(failures.length){console.error([...new Set(failures)].join('\n'));process.exit(1)}console.log('Chromium route audit PASS')})().catch(e=>{console.error(e);process.exit(2)});
          NODE
          node route-audit.cjs
      - name: Raw Axe contrast diagnostics
        shell: bash
        run: |
          cat > axe-diagnostics.cjs <<'NODE'
          const {chromium}=require('playwright');
          const axe=require('axe-core');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto(process.env.ROOT_URL+'?axe='+process.env.GITHUB_SHA,{waitUntil:'networkidle'});
            await page.waitForTimeout(700);
            await page.addScriptTag({content:axe.source});
            const result=await page.evaluate(async()=>{
              const styleSelectors=['.brand-mark','#main-nav a:nth-child(2)','.eyebrow','.hero h1','.hero .lead','.btn.primary','.fact b','.fact span','.section-head h2','.section-head p','.service-mini b','.service-mini small','.clarity-card h2','.clarity-card p','.quick-card h2','.quick-card p'];
              const computed=styleSelectors.map(selector=>{const el=document.querySelector(selector);if(!el)return{selector,missing:true};const cs=getComputedStyle(el);const parent=el.parentElement?getComputedStyle(el.parentElement):null;return{selector,color:cs.color,background:cs.backgroundColor,backgroundImage:cs.backgroundImage,opacity:cs.opacity,filter:cs.filter,parentBackground:parent?.backgroundColor,parentBackgroundImage:parent?.backgroundImage};});
              const audit=await axe.run(document,{runOnly:{type:'rule',values:['color-contrast']}});
              const violations=audit.violations.flatMap(v=>v.nodes.slice(0,20).map(n=>({target:n.target,html:n.html,data:n.any?.[0]?.data||n.all?.[0]?.data||null,message:n.any?.[0]?.message||n.all?.[0]?.message||''})));
              return{computed,violations};
            });
            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE
          node axe-diagnostics.cjs
      - name: Lighthouse multi-run root
        run: node .github/scripts/lighthouse-median.cjs root "$ROOT_URL"
      - name: Lighthouse multi-run services
        run: node .github/scripts/lighthouse-median.cjs services "${ROOT_URL}services/"
      - name: Automated WCAG evidence
        shell: bash
        run: |
          cat > pa11y-audit.cjs <<'NODE'
          const pa11y=require('pa11y');
          const targets=['','services/','guides/','experience/','booking/','tools/treatment-comparison/','ai-info/','safety/dental-emergency/','dentist-tehran-22/','contact/'];
          (async()=>{let n=0;for(const route of targets){const sep=route.includes('?')?'&':'?';const url=process.env.ROOT_URL+route+sep+'wcag='+process.env.GITHUB_SHA;const r=await pa11y(url,{standard:'WCAG2AA',runners:['axe','htmlcs'],includeWarnings:false,includeNotices:false,wait:700,chromeLaunchConfig:{args:['--no-sandbox']}});console.log(route||'root',r.issues.length);for(const i of r.issues)console.error(route,i.code,i.message,i.selector);n+=r.issues.length}if(n)process.exit(1)})().catch(e=>{console.error(e);process.exit(2)});
          NODE
          node pa11y-audit.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-source-browser-audit-evidence
          path: |
            lighthouse-root-*.json
            lighthouse-root-summary.json
            lighthouse-services-*.json
            lighthouse-services-summary.json
          if-no-files-found: warn
  dast-baseline:
    name: OWASP ZAP public baseline evidence
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Wait for public root
        run: |
          for i in {1..24}; do curl -fsS "$ROOT_URL" >/dev/null && exit 0; sleep 10; done; exit 1
      - name: ZAP baseline
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm -v "$PWD/zap-out:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$ROOT_URL" -I -J zap.json -r zap.html
      - name: Upload ZAP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-source-zap-evidence
          path: zap-out/
          if-no-files-found: warn
