<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a6c66" />
    <title>مینا | بدون اینترنت</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#e7fff4,#f8fcfa 55%,#ece8ff);color:#073f3d;font-family:Tahoma,Arial,sans-serif;padding:24px}.card{width:min(440px,100%);text-align:center;border:1px solid rgba(10,108,102,.14);border-radius:32px;background:rgba(255,255,255,.9);box-shadow:0 28px 80px rgba(6,63,61,.15);padding:32px}.card img{width:112px;height:112px;object-fit:cover;border:6px solid white;border-radius:32px;box-shadow:0 16px 38px rgba(10,108,102,.22);margin:0 auto 22px}.card h1{font-size:1.55rem;margin:0 0 12px}.card p{color:#4f6d6a;font-size:.86rem;line-height:1.9;margin:0 0 22px}.card button{border:0;border-radius:15px;background:#0a6c66;color:white;padding:13px 20px;font:700 .86rem Tahoma,Arial,sans-serif;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/mina-logo.jpeg" alt="لوگوی مینا" />
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>بخش‌های ذخیره‌شده در دسترس‌اند. برای مشاهده تازه‌ترین اطلاعات، اتصال اینترنت را بررسی و دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
